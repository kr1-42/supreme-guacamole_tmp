{% extends "base.html" %}

{% block content %}
<h1>Sales</h1>

<section class="card form-card">
    <h2>Add Sale</h2>
    <form method="post" class="grid-form">
        <label>
            Artwork
            <select name="artwork_id" required>
                <option value="">Select artwork</option>
                {% for artwork in artworks %}
                    <option value="{{ artwork['id'] }}">{{ artwork['title'] }}{% if artwork['artist_name'] %} — {{ artwork['artist_name'] }}{% endif %}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            Sale Date
            <input type="datetime-local" name="sale_date" required>
        </label>
        <label>
            Sale Price
            <input type="number" name="sale_price" step="0.01" required>
        </label>
        <label>
            Buyer Name
            <input type="text" name="buyer_name">
        </label>
        <label>
            Payment Method
            <input type="text" name="payment_method">
        </label>
        <label class="full">
            Notes
            <textarea name="notes" rows="3"></textarea>
        </label>
        <button type="submit">Create Sale</button>
    </form>
</section>

<section class="card">
    <h2>Sales List</h2>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Artwork</th>
                    <th>Artist</th>
                    <th>Price</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for sale in sales %}
                    <tr>
                        <td>{{ sale["sale_date"] }}</td>
                        <td>{{ sale["artwork_title"] }}</td>
                        <td>{{ sale["artist_name"] or '-' }}</td>
                        <td>{{ sale["sale_price"] }}</td>
                        <td>
                            <a class="link" href="{{ url_for('sale_detail', sale_id=sale['id']) }}">View</a>
                        </td>
                    </tr>
                {% else %}
                    <tr>
                        <td colspan="5" class="muted">No sales yet.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
