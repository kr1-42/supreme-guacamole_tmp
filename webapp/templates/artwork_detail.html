{% extends "base.html" %}

{% block content %}
<h1>{{ artwork["title"] }}</h1>

<section class="card form-card">
    <h2>Edit Artwork</h2>
    <form method="post" class="grid-form">
        <label>
            Title
            <input type="text" name="title" value="{{ artwork['title'] }}" required>
        </label>
        <label>
            Artist
            <select name="artist_id">
                <option value="">Unassigned</option>
                {% for artist in artists %}
                    <option value="{{ artist['id'] }}" {% if artwork['artist_id'] == artist['id'] %}selected{% endif %}>
                        {{ artist['name'] }}
                    </option>
                {% endfor %}
            </select>
        </label>
        <label>
            Code
            <input type="text" name="code" value="{{ artwork['code'] or '' }}">
        </label>
        <label>
            Type
            <input type="text" name="type" value="{{ artwork['type'] or '' }}">
        </label>
        <label>
            Quantity
            <input type="number" name="quantity" min="1" value="{{ artwork['quantity'] or 1 }}">
        </label>
        <label>
            Year
            <input type="number" name="year" value="{{ artwork['year'] or '' }}">
        </label>
        <label>
            Price
            <input type="number" name="price" step="0.01" value="{{ artwork['price'] or '' }}">
        </label>
        <label>
            Artist Cut %
            <input type="number" name="artist_cut_percent" step="0.1" value="{{ artwork['artist_cut_percent'] or 10 }}">
        </label>
        <label>
            Status
            <select name="status">
                {% for status in status_options %}
                    <option value="{{ status }}" {% if artwork['status'] == status %}selected{% endif %}>
                        {{ status }}
                    </option>
                {% endfor %}
            </select>
        </label>
        <label>
            Image Filename
            <input type="text" name="image" value="{{ artwork['image'] or '' }}">
        </label>
        <label class="full">
            Description
            <textarea name="description" rows="3">{{ artwork['description'] or '' }}</textarea>
        </label>
        <label class="full">
            Notes
            <textarea name="notes" rows="3">{{ artwork['notes'] or '' }}</textarea>
        </label>
        <div class="actions">
            <button type="submit">Save Changes</button>
        </div>
    </form>
    <form method="post" action="{{ url_for('artwork_delete', artwork_id=artwork['id']) }}" onsubmit="return confirm('Delete this artwork?');" class="inline-form">
        <button type="submit" class="danger">Delete</button>
    </form>
</section>

<section class="card">
    <h2>Preview</h2>
    {% if artwork['image'] %}
        <img class="preview" src="{{ url_for('artwork_image', filename=artwork['image']) }}" alt="{{ artwork['title'] }}">
    {% else %}
        <div class="muted">No image assigned.</div>
    {% endif %}
</section>
{% endblock %}
